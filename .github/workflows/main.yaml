name: workflow

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

permissions:
  contents: read

jobs:

  # ==========================================
  # CONTINUOUS INTEGRATION
  # ==========================================
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint code
        run: echo "Linting repository"

      - name: Run unit tests
        run: echo "Running unit tests"


  # ==========================================
  # BUILD AND PUSH IMAGE TO ECR
  # ==========================================
  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      # ----------------------------------------
      # Install utilities
      # ----------------------------------------
      - name: Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip


      # ----------------------------------------
      # Configure AWS credentials
      # ----------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      # ----------------------------------------
      # Login to Amazon ECR
      # ----------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ----------------------------------------
      # Build and Push Docker Image
      # ----------------------------------------
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: 933428634277.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: studentperformance
          IMAGE_TAG: latest

        run: |

          echo "Building Docker image..."

          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          echo "Docker image built successfully."

          echo "Pushing Docker image to ECR..."

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "Docker image pushed successfully."



  # ==========================================
  # CONTINUOUS DEPLOYMENT
  # ==========================================
  Continuous-Deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image

    # EC2 GitHub self-hosted runner
    runs-on: self-hosted

    steps:

      # ----------------------------------------
      # Configure AWS credentials
      # ----------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      # ----------------------------------------
      # Login to Amazon ECR
      # ----------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ========================================
      # DEBUG DOCKER PERMISSIONS
      # ========================================
      - name: Check runner Docker permissions
        run: |

          echo "======================================"
          echo "WHO AM I?"
          echo "======================================"
          whoami

          echo "======================================"
          echo "USER ID AND GROUPS"
          echo "======================================"
          id

          echo "======================================"
          echo "GROUPS"
          echo "======================================"
          groups

          echo "======================================"
          echo "DOCKER SOCKET"
          echo "======================================"
          ls -l /var/run/docker.sock

          echo "======================================"
          echo "DOCKER VERSION"
          echo "======================================"
          docker --version

          echo "======================================"
          echo "DOCKER PS"
          echo "======================================"
          docker ps


      # ========================================
      # PULL LATEST IMAGE FROM ECR
      # ========================================
      - name: Pull latest image
        run: |

          echo "Pulling latest image from ECR..."

          docker pull \
            933428634277.dkr.ecr.ap-south-1.amazonaws.com/studentperformance:latest

          echo "Image pulled successfully."


      # ========================================
      # STOP OLD CONTAINER
      # ========================================
      - name: Stop old container
        run: |

          docker stop mltest || true

          docker rm mltest || true


      # ========================================
      # RUN NEW CONTAINER
      # ========================================
      - name: Run Docker container
        run: |

          docker run -d \
            --name mltest \
            -p 5000:5000 \
            933428634277.dkr.ecr.ap-south-1.amazonaws.com/studentperformance:latest

          echo "Container started successfully."


      # ========================================
      # SHOW RUNNING CONTAINERS
      # ========================================
      - name: Check running container
        run: |

          docker ps

          echo "======================================"
          echo "CONTAINER LOGS"
          echo "======================================"

          docker logs mltest --tail 50


      # ========================================
      # CLEAN OLD DOCKER RESOURCES
      # ========================================
      - name: Clean previous images and containers
        run: |

          docker system prune -f