name: workflow

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

jobs:

  # ==============================
  # CONTINUOUS INTEGRATION
  # ==============================
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint code
        run: echo "Linting repository"

      - name: Run unit tests
        run: echo "Running unit tests"


  # ==============================
  # BUILD & PUSH DOCKER IMAGE
  # ==============================
  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip


      # ==============================
      # AWS CREDENTIALS
      # ==============================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      # ==============================
      # LOGIN TO ECR
      # ==============================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ==============================
      # BUILD & PUSH IMAGE
      # ==============================
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: 933428634277.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: studentperformance
          IMAGE_TAG: latest

        run: |

          echo "Building Docker image..."

          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          echo "Docker image built successfully."

          echo "Pushing image to Amazon ECR..."

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "Image pushed successfully."

          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV


  # ==============================
  # CONTINUOUS DEPLOYMENT
  # ==============================
  Continuous-Deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image

    # IMPORTANT:
    # This requires GitHub Actions Runner
    # to be installed/configured on EC2.
    runs-on: self-hosted

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      # ==============================
      # LOGIN TO ECR
      # ==============================
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ==============================
      # PULL LATEST IMAGE
      # ==============================
      - name: Pull latest image
        run: |

          docker pull \
            933428634277.dkr.ecr.ap-south-1.amazonaws.com/studentperformance:latest


      # ==============================
      # STOP OLD CONTAINER
      # ==============================
      - name: Stop and remove old container
        run: |

          docker stop mltest || true
          docker rm mltest || true


      # ==============================
      # RUN NEW CONTAINER
      # ==============================
      - name: Run Docker container
        run: |

          docker run -d \
            --name mltest \
            -p 5000:5000 \
            933428634277.dkr.ecr.ap-south-1.amazonaws.com/studentperformance:latest


      # ==============================
      # CLEAN OLD DOCKER RESOURCES
      # ==============================
      - name: Clean previous images and containers
        run: |

          docker system prune -f